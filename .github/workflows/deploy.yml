name: Deploy Mind Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Website
        run: |
          rm -rf build_site
          mkdir -p build_site

          # Root website files
          cp -r index.html build_site/

          # अगर ये folders मौजूद हैं तो उन्हें भी website में शामिल करें
          for dir in css js images assets; do
            if [ -d "$dir" ]; then
              cp -r "$dir" build_site/
            fi
          done

          # 404 page
          cp index.html build_site/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build_site
          publish_branch: gh-pages
