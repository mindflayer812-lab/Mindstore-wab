name: Deploy Mind Store to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Web Assets
        run: |
          mkdir -p build_site
          if [ -d "app/src/main/assets" ]; then
            cp -r app/src/main/assets/* build_site/ 2>/dev/null || true
          fi
          if [ -f "index.html" ]; then
            cp index.html build_site/
            cp index.html build_site/404.html
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build_site
          publish_branch: gh-pages
          force_orphan: true

